version: '3.8'

services:
  # API Backend
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: variant-classifier-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - variant-net

  # Frontend Streamlit
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: variant-classifier-frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - variant-net

networks:
  variant-net:
    driver: bridge

volumes:
  models:
  data:
